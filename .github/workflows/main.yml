name: APK Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # v3'ten v4'e güncellendi
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - name: Upload APK
        uses: actions/upload-artifact@v4  # Hata veren v3, v4 yapıldı
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/*.apk